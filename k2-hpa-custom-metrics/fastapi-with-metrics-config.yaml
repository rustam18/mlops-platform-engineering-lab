# fastapi-with-metrics-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-app-config
  namespace: mlops
data:
  main.py: |
    from fastapi import FastAPI
    from prometheus_client import Counter, generate_latest, CONTENT_TYPE_LATEST
    from starlette.responses import Response
    import os

    app = FastAPI()
    REQUEST_COUNT = Counter('fastapi_requests_total', 'Total requests')

    @app.get("/")
    def root():
        REQUEST_COUNT.inc()
        return {"model": os.getenv("MODEL_NAME", "default")}

    @app.get("/metrics")
    def metrics():
        return Response(generate_latest(), media_type=CONTENT_TYPE_LATEST)
