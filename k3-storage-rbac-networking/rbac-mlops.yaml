# rbac-mlops.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-sa
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fastapi-role
  namespace: mlops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["fastapi-config"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["fastapi-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fastapi-rolebinding
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: fastapi-sa
    namespace: mlops
roleRef:
  kind: Role
  name: fastapi-role
  apiGroup: rbac.authorization.k8s.io
